    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b0f; }
      /* winit gives the canvas a tabindex so it can take keyboard focus; without this the
         browser draws a focus ring around the whole client. eframe used to set the same
         property from Rust. */
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      /* The boot readout, over the canvas until the client draws its own first frame. Painted
         from the HTML rather than by the client, because the whole point is the minute BEFORE
         any of the client exists; web/loading.js drives it. */
      #boot { position: fixed; inset: 0; display: grid; place-items: center;
              background: #0b0b0f; color: #7a829e; opacity: 1; transition: opacity 0.4s ease;
              pointer-events: none;
              font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
      #boot-inner { width: min(26em, 80vw); text-align: center; }
      #boot-track { height: 2px; background: #1c1f2b; margin-bottom: 0.9em; }
      /* Zero-width at rest: a bar that starts with a visible stub claims progress that has not
         happened. Warm brass on the cold hud, the client's own accent. */
      #boot-bar { height: 100%; width: 0; background: #c08a3e; transition: width 0.2s ease; }
      #boot-note { line-height: 1.5; }
    </style>
    <!-- Browsers create every AudioContext SUSPENDED until a user gesture, and the audio
         stack (bevy -> rodio -> cpal) builds its context at startup — before any gesture —
         and never asks again. Without this shim the whole game plays into a stopped clock:
         no error anywhere, just silence. Wrap the constructor so every context the wasm
         makes is remembered, and kick any suspended one awake on each interaction (kept
         registered, not once — a tab backgrounded long enough can suspend it again). Must
         run BEFORE the trunk loader below so the wrap is in place when the wasm boots. -->
    <script>
      (function () {
        var Real = window.AudioContext || window.webkitAudioContext;
        if (!Real) return;
        var made = [];
        var Wrapped = function () {
          var c = new (Function.prototype.bind.apply(
            Real,
            [null].concat([].slice.call(arguments))
          ))();
          made.push(c);
          return c;
        };
        Wrapped.prototype = Real.prototype;
        window.AudioContext = Wrapped;
        if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
        var kick = function () {
          made.forEach(function (c) {
            if (c.state === "suspended") c.resume();
          });
        };
        ["pointerdown", "keydown", "touchstart"].forEach(function (e) {
          window.addEventListener(e, kick, { capture: true });
        });
      })();
    </script>
    <!-- Trunk builds this crate to wasm and injects the loader. wasm-opt is off: bevy emits
         bulk-memory ops that trunk's bundled wasm-opt rejects without --enable-bulk-memory,
         and running it by hand barely moves the compressed transfer size. -->
    <!-- `data-initializer` hands the wasm fetch to web/loading.js, which draws the boot readout
         below: trunk streams the download through it and reports bytes against the BUILT
         bundle's own size, which is the one figure a compressed transfer cannot supply. -->
    
<script type="module">
async function __trunkInitializer(init, source, sourceSize, initializer, initWithObject) {
  if (initializer === undefined) {
    return await init(initWithObject ? { module_or_path: source } : source);
  }

  const {
    onStart, onProgress, onComplete, onSuccess, onFailure
  } = initializer;

  onStart?.();

  const response = fetch(source)
      .then((response) => {
        const reader = response.body.getReader();
        const headers = response.headers;
        const status = response.status;
        const statusText = response.statusText;

        const total = sourceSize;
        let current = 0;

        const stream = new ReadableStream({
          start(controller) {
            function push() {
              reader.read().then(({done, value}) => {
                if (done) {
                  onProgress?.({current: total, total});
                  controller.close();
                  return;
                }

                current += value.byteLength;
                onProgress?.({current, total});
                controller.enqueue(value);
                push();
              });
            }

            push();
          },
        });

        return {
          stream, init: {
            headers, status, statusText
          }
        };
      })
      .then(({stream, init}) =>
          new Response(stream, init),
      );

  return init(initWithObject ? { module_or_path: response } : response)
      .then((value) => {
        onComplete?.();
        onSuccess?.(value);
        return value;
      }, (reason) => {
        onComplete?.();
        onFailure?.(reason);
        return reason;
      });
}

import initializer from '/game/webgpu/d88772b8078eefd7-loading.js';

window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <!-- Runtime-loaded assets: the two directories the AssetServer fetches at RUNTIME, and
         only those. The rest of crates/gui/assets is PNGs that `include_bytes!` already bakes
         into the binary, and shipping those again would double their weight for nothing.
         bevy fetches these over HTTP on wasm, so a missing copy is not a build error -- it is
         pilots stuck as capsules, or a deck that draws plain white where its surface should
         be. Anything the client `asset_server.load()`s by path belongs on this list. -->
    
    
    <!-- The equipment icons (#281's baked set). Absent from the staging, every icons/ request
         fell through to this page's own HTML — an "Invalid PNG signature" per icon. -->
    
    <!-- The item emblem pool. Copied wholesale like the prop meshes and pruned the same way:
         the repo carries 199 for an author to pick from, and prune-assets.sh keeps only the
         ones some item in data/ actually names. -->
    
    <!-- The skin mask's fragment shader. `Material::fragment_shader` returns a PATH, so bevy
         fetches it over HTTP like any other asset; absent from the staging, the material never
         builds and the pilot's body draws nothing at all. -->
